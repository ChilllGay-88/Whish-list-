<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Мой Wish List</title>
<style>
:root{--bg:#f5f3ef;--card:#fff;--ink:#242321;--muted:#77736d;--line:#e8e4dd;--accent:#262522;--soft:#efede8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:900px;margin:auto;padding:34px 18px 60px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:28px}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
h1{font-size:clamp(34px,7vw,56px);line-height:1.02;letter-spacing:-.05em;margin:8px 0}
.sub{color:var(--muted);margin:10px 0 0}
.count{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 16px;text-align:center;min-width:88px}
.count strong{display:block;font-size:24px}.count span{font-size:12px;color:var(--muted)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:22px 0}
input,select,button{font:inherit;border-radius:12px;border:1px solid var(--line);padding:11px 13px;background:var(--card);color:var(--ink)}
#search{flex:1;min-width:160px}button{cursor:pointer}button.primary{background:var(--accent);color:white;border-color:var(--accent);font-weight:600}
button:hover{filter:brightness(.96)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.item{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;min-height:220px}
.photo{height:145px;background:linear-gradient(135deg,#e9e5de,#f7f5f1);display:flex;align-items:center;justify-content:center;color:#aaa;font-size:34px;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover}
.info{padding:14px;display:flex;flex-direction:column;gap:7px;flex:1}
.category{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.name{font-size:18px;font-weight:650;overflow-wrap:anywhere}
.price{font-weight:650}
.note{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.actions{display:flex;gap:8px;margin-top:auto;padding-top:8px;flex-wrap:wrap}
.actions button,.actions a{font-size:13px;padding:8px 10px;text-decoration:none;border-radius:10px}
.actions a{background:var(--soft);color:var(--ink)}
.actions .done{background:#e8efe8;border-color:#d5e2d5}
.empty{padding:42px 18px;text-align:center;border:1px dashed #d6d0c6;border-radius:18px;color:var(--muted);grid-column:1/-1}
dialog{border:0;border-radius:20px;padding:0;width:min(480px,calc(100% - 28px));box-shadow:0 20px 80px #0003}
dialog::backdrop{background:#17161288}
form{padding:22px;display:grid;gap:12px}form h2{margin:0 0 4px}
form label{font-size:13px;color:var(--muted);display:grid;gap:5px}
form input,form select{width:100%}
.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
footer{margin-top:28px;color:var(--muted);font-size:12px}
@media(max-width:520px){main{padding-top:24px}header{align-items:center}.count{min-width:72px;padding:9px}.toolbar>*{flex:1}#search{flex-basis:100%}}
</style>
</head>
<body>
<main>
<header>
 <div><div class="eyebrow">Личный список желаний</div><h1>Wish List<span style="color:#a7a198">.</span></h1><p class="sub">Сохраняй то, что хочешь. Покупай, когда придёт время.</p></div>
 <div class="count"><strong id="total">0</strong><span>желаний</span></div>
</header>
<div class="toolbar">
 <input id="search" type="search" placeholder="Найти желание…">
 <select id="filter"><option value="all">Все</option><option value="want">Хочу</option><option value="done">Получено</option></select>
 <button class="primary" id="add">＋ Добавить</button>
</div>
<section class="grid" id="items"></section>
<footer>Список хранится в памяти этого браузера на этом устройстве. Чтобы не потерять его, периодически сохраняй резервную копию.</footer>
</main>
<dialog id="modal">
<form id="wishForm">
 <h2 id="formTitle">Новое желание</h2>
 <label>Название *<input name="name" required maxlength="100" placeholder="Например, наушники"></label>
 <label>Категория<select name="category"><option>Техника</option><option>Одежда</option><option>Для дома</option><option>Хобби</option><option>Подарки</option><option>Другое</option></select></label>
 <label>Цена<input name="price" inputmode="decimal" placeholder="Например, 5990 ₽"></label>
 <label>Ссылка на товар<input name="url" type="url" placeholder="https://…"></label>
 <label>Ссылка на изображение (необязательно)<input name="image" type="url" placeholder="https://…"></label>
 <label>Заметка<input name="note" maxlength="180" placeholder="Цвет, модель, почему хочется…"></label>
 <div class="form-actions"><button type="button" id="cancel">Отмена</button><button class="primary" type="submit">Сохранить</button></div>
</form>
</dialog>
<script>
const KEY='my-wishlist-v1';
let wishes=[];let editing=null;
try{wishes=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){wishes=[]}
const $=s=>document.querySelector(s);
function save(){localStorage.setItem(KEY,JSON.stringify(wishes));render()}
function safeUrl(s){try{const u=new URL(s);return ['http:','https:'].includes(u.protocol)?u.href:''}catch{return ''}}
function render(){
 const q=$('#search').value.toLowerCase(),f=$('#filter').value;
 const shown=wishes.filter(w=>(f==='all'||(f==='done'?w.done:!w.done))&&[w.name,w.category,w.note].join(' ').toLowerCase().includes(q));
 $('#total').textContent=wishes.length;
 const root=$('#items');root.innerHTML='';
 if(!shown.length){root.innerHTML='<div class="empty">Пока здесь пусто.<br>Добавь первое желание — оно появится здесь.</div>';return}
 shown.forEach(w=>{
  const card=document.createElement('article');card.className='item';
  const photo=document.createElement('div');photo.className='photo';
  const img=safeUrl(w.image);if(img){const el=document.createElement('img');el.src=img;el.alt='';el.onerror=()=>{photo.textContent='✦'};photo.append(el)}else photo.textContent='✦';
  const info=document.createElement('div');info.className='info';
  const cat=document.createElement('div');cat.className='category';cat.textContent=w.category;
  const name=document.createElement('div');name.className='name';name.textContent=w.name;
  info.append(cat,name);
  if(w.price){const p=document.createElement('div');p.className='price';p.textContent=w.price;info.append(p)}
  if(w.note){const n=document.createElement('div');n.className='note';n.textContent=w.note;info.append(n)}
  const actions=document.createElement('div');actions.className='actions';
  const toggle=document.createElement('button');toggle.className='done';toggle.textContent=w.done?'↶ Вернуть':'✓ Получено';toggle.onclick=()=>{w.done=!w.done;save()};
  const edit=document.createElement('button');edit.textContent='Изменить';edit.onclick=()=>openForm(w.id);
  actions.append(toggle,edit);
  const link=safeUrl(w.url);if(link){const a=document.createElement('a');a.href=link;a.target='_blank';a.rel='noopener noreferrer';a.textContent='Открыть товар';actions.append(a)}
  const del=document.createElement('button');del.textContent='Удалить';del.onclick=()=>{if(confirm('Удалить это желание?')){wishes=wishes.filter(x=>x.id!==w.id);save()}};actions.append(del);
  info.append(actions);card.append(photo,info);root.append(card);
 });
}
function openForm(id=null){
 editing=id;const form=$('#wishForm');form.reset();$('#formTitle').textContent=id?'Изменить желание':'Новое желание';
 if(id){const w=wishes.find(x=>x.id===id);Object.keys(w).forEach(k=>{if(form.elements[k])form.elements[k].value=w[k]??''})}
 $('#modal').showModal();
}
$('#add').onclick=()=>openForm();$('#cancel').onclick=()=>$('#modal').close();
$('#wishForm').onsubmit=e=>{
 e.preventDefault();const data=Object.fromEntries(new FormData(e.currentTarget).entries());
 if(editing){const w=wishes.find(x=>x.id===editing);Object.assign(w,data)}
 else wishes.unshift({id:crypto.randomUUID(),...data,done:false});
 save();$('#modal').close();
};
$('#search').oninput=render;$('#filter').onchange=render;
render();
</script>
</body>
</html>
